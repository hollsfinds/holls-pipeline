<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holls Finds — Product Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#F87E72; --peach:#FFEDE3; --sage:#DEF0E2; --teal:#2FA9A4;
    --espresso:#23272D; --ink:#1B1F24; --muted:#6E7681; --line:#EAEDF1;
    --bg:#FFFFFF; --card:#FFFFFF; --cream:#F6F7F9;
    --good:#2FA9A4; --warn:#F87E72;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Raleway',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.45;font-size:14px}
  header{background:#fff;color:var(--ink);padding:13px 26px;display:flex;align-items:center;gap:11px;
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
  header .dot{width:13px;height:13px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px #f8837822}
  header h1{font-family:'Sora',sans-serif;font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
  header .obsessed{color:var(--muted);font-style:italic;font-size:12px;align-self:flex-end;font-weight:600}
  h3{font-family:'Sora',sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 26px 80px}
  .lanes{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 16px}
  .lane{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13.5px;
        cursor:pointer;font-weight:700;color:var(--espresso);transition:.15s}
  .lane:hover{border-color:var(--coral)}
  .lane.active{background:var(--coral);border-color:var(--coral);color:#fff}
  .lane.soon{opacity:.5;cursor:not-allowed}
  .searchbar{display:flex;gap:10px;margin:4px 0 8px}
  .searchbar input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
  .searchbar input:focus{outline:none;border-color:var(--teal)}
  .pp-maninput{flex:1;min-width:150px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:#fff;font-family:inherit}
  .pp-maninput:focus{outline:none;border-color:var(--teal)}
  .btn{background:var(--coral);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:15px;
       font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ghost{background:#fff;color:var(--espresso);border:1px solid var(--line)}
  .hint{font-size:12.5px;color:var(--muted);margin:2px 2px 14px}
  .meters{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 2px 4px}
  .meters b{color:var(--espresso)}
  .demandcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0;display:none}
  .demandcard h3{margin:0 0 4px;font-size:14px}
  .demand-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
  .spark{display:flex;align-items:flex-end;gap:2px;height:42px;margin-top:8px}
  .spark span{flex:1;background:var(--sage);border-radius:2px 2px 0 0;min-height:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px;margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
        position:relative;transition:.15s}
  .card.pick{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
  .card .imgwrap{aspect-ratio:1;background:var(--peach);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:contain}
  .score{position:absolute;top:8px;left:8px;background:var(--espresso);color:#fff;border-radius:8px;
         padding:3px 9px;font-weight:800;font-size:14px}
  .score.promote{background:var(--teal)} .score.watch{background:var(--peach);color:var(--espresso)}
  .badge{position:absolute;top:8px;right:8px;background:#fff;border:1px solid var(--line);border-radius:8px;
         padding:2px 7px;font-size:11px;font-weight:700;color:var(--coral)}
  .card .body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .title{font-size:12.5px;line-height:1.35;max-height:52px;overflow:hidden;font-weight:600}
  .card .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);align-items:center}
  .card .price{font-weight:800;color:var(--espresso);font-size:15px}
  .card .stars{color:var(--coral);font-weight:700}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
  .pickbtn{flex:1;border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:9px;
           padding:7px;font-weight:700;font-size:12.5px;cursor:pointer}
  .card.pick .pickbtn{background:var(--teal);color:#fff}
  .peek{font-size:11.5px;color:var(--muted);text-decoration:none}
  .gatedout{font-size:12.5px;color:var(--muted);margin:18px 2px;padding:10px 14px;background:#fff;border:1px dashed var(--line);border-radius:10px}
  /* output tray */
  .tray{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--coral);
        padding:14px 26px;box-shadow:0 -6px 24px rgba(0,0,0,.08);display:none;max-height:42vh;overflow:auto}
  .tray h3{margin:0 0 8px;font-size:15px}
  .tray .urls{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--cream);border:1px solid var(--line);
              border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
  .tray .actions{display:flex;gap:10px;margin-top:10px;align-items:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;
         padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .sortbar{display:flex;gap:8px;align-items:center;margin:14px 2px 2px;font-size:13px}
  .sortbar select{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#fff}
  .empty{color:var(--muted);font-size:14px;padding:30px 2px}
  /* lane sub-panels (Evergreen rooms / Seasonal pushes) */
  #ppsub{margin:0 0 6px}
  .pp-subnote{font-size:12.5px;color:var(--muted);margin:2px 2px 8px;font-weight:600}
  .pp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .pp-chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;
           font-weight:600;cursor:pointer;color:var(--espresso);font-family:inherit}
  .pp-chip:hover{border-color:var(--coral)}
  .pp-chip.urgent{border-color:var(--coral);background:#fff4f1}
  .pp-due{color:var(--muted);font-size:11px;font-weight:700;margin-left:4px}
  .pp-chip.urgent .pp-due{color:var(--coral)}
  .pp-phase{display:inline-block;margin-left:7px;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;vertical-align:middle}
  .pp-back{border:none;background:none;color:var(--teal);font-weight:700;cursor:pointer;font-family:inherit;font-size:12.5px;padding:0;margin-right:6px}
  #ppbanner{display:none;background:#fff4f1;border:1px solid var(--coral);color:var(--espresso);
            border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:13px;font-weight:600}
  #ppbanner a{color:var(--coral);font-weight:800}
  .pp-stylewrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 6px}
  .pp-styleinput{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;font-family:inherit;width:190px}
  .pp-styleinput:focus{outline:none;border-color:var(--teal)}
  .pp-stylechip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pp-ai{display:inline-block;background:var(--teal);color:#fff;font-size:9px;font-weight:800;border-radius:5px;
         padding:1px 5px;margin-left:5px;vertical-align:middle;letter-spacing:.4px;text-transform:uppercase}
  .pp-refresh{border:none;background:none;color:var(--teal);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;margin-left:8px}
  .pp-season{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--espresso);font-family:inherit}
  .pp-season.on{background:var(--coral);border-color:var(--coral);color:#fff}
  .pp-sectlabel{font-family:'Sora',sans-serif;font-size:13px;font-weight:800;color:var(--coral);margin:18px 2px 7px}
  .pp-sectlabel .opt{font-weight:600;color:var(--muted);font-size:11.5px}
  .pp-stylebox{background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:2px}
  .pp-typechip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--espresso);font-family:inherit}
  .pp-typechip:hover{border-color:var(--teal)}
  .pp-typechip.done{opacity:.55;border-style:dashed}
  .pp-theme{display:inline-flex;align-items:center}
  .pp-deny{margin-left:8px;color:var(--muted);font-weight:800;cursor:pointer;border-radius:4px;padding:0 4px;font-size:12px}
  .pp-deny:hover{color:#fff;background:var(--coral)}
  .pp-strip{background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:6px 0 14px}
  .pp-strip h4{font-family:'Sora',sans-serif;font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .pp-stripitems{display:flex;gap:8px;flex-wrap:wrap}
  .pp-stripitem{width:62px;position:relative}
  .pp-stripitem img{width:62px;height:62px;object-fit:contain;background:var(--peach);border-radius:8px;border:1px solid var(--line)}
  .pp-stripitem .rm{position:absolute;top:-6px;right:-6px;background:var(--coral);color:#fff;border-radius:50%;width:17px;height:17px;font-size:12px;line-height:17px;text-align:center;cursor:pointer}
  .pp-board{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px;align-items:flex-start}
  .pp-col{flex:0 0 178px;min-width:178px}
  .pp-colhead{font-size:12px;font-weight:800;color:var(--espresso);margin:0 0 7px;text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center}
  .pp-pcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;margin-bottom:8px;background:#fff}
  .pp-pcard.locked{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
  .pp-pcard img{width:100%;height:108px;object-fit:contain;background:var(--peach);display:block}
  .pp-pcard .pi{padding:6px 7px}
  .pp-pcard .pt{font-size:11px;line-height:1.3;max-height:43px;overflow:hidden;font-weight:600}
  .pp-pcard .pm{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
  .pp-pcard .pp{font-weight:800;color:var(--espresso)}
  .pp-pcard .peek{display:block;margin-top:5px;font-size:11px;color:var(--teal);text-decoration:none;font-weight:700}
  .pp-picked{border:2px solid var(--teal);border-radius:10px;padding:6px;margin-bottom:10px;background:#fff;position:relative}
  .pp-picked img{width:100%;height:78px;object-fit:contain;background:var(--peach);border-radius:6px;display:block}
  .pp-picked .pt{font-size:10.5px;line-height:1.25;max-height:39px;overflow:hidden;font-weight:600;margin-top:4px}
  .pp-picked .rm{position:absolute;top:-7px;right:-7px;background:var(--coral);color:#fff;border-radius:50%;width:17px;height:17px;font-size:12px;line-height:17px;text-align:center;cursor:pointer;z-index:1}
  .pp-pcard{position:relative}
  .pp-pcard .bimg{position:relative}
  .pp-pcard .bimg img{width:100%;height:100px;object-fit:contain;background:var(--peach);display:block}
  .pp-pcard .bscore{position:absolute;top:5px;left:5px;background:var(--espresso);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800}
  .pp-pcard .bscore.promote{background:var(--teal)}
  .pp-pcard .bscore.watch{background:#E8A33D}
  .pp-pcard .bsales{position:absolute;top:5px;right:5px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:9px;font-weight:700;color:var(--espresso);max-width:92px;line-height:1.15}
  .pp-pcard .pact{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px}
  .pp-pcard .pact .peek{margin-top:0}
  .pp-pcard .pcopy{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:10.5px;font-weight:700;padding:2px 8px;cursor:pointer;color:var(--espresso)}
  .pp-pcard .brm{position:absolute;top:-7px;right:-7px;background:var(--coral);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;cursor:pointer;z-index:2}
  .pp-traygrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .pp-traygrid .pp-pcard{flex:0 0 152px;width:152px;margin-bottom:0;cursor:default}
  .pp-season.urgent .pp-due{color:var(--coral)}
  .card .row .pcopy{border:1.5px solid var(--line);background:#fff;color:var(--espresso);border-radius:9px;font-weight:700;font-size:12px;padding:0 11px;cursor:pointer}
  .pp-more{width:100%;border:1px dashed var(--line);background:#fff;border-radius:9px;padding:6px;font-size:12px;font-weight:700;color:var(--teal);cursor:pointer;font-family:inherit}
  .pp-step{font-family:'Sora',sans-serif;font-size:13px;font-weight:800;color:var(--espresso);margin:18px 2px 9px}
  .pp-step:first-child{margin-top:2px}
  .pp-step.active{color:var(--coral)}
  .pp-chip.sel{background:var(--coral);border-color:var(--coral);color:#fff}
  .pp-chip.sel .pp-deny{color:#fff}
  .pp-start{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--espresso);cursor:pointer;font-family:'Raleway',sans-serif}
  .pp-start:hover{border-color:var(--coral);color:var(--coral)}
  .pp-ablabel{font-size:12px;font-weight:800;color:var(--coral);margin:10px 2px 6px}
</style>
</head>
<body>
<header>
  <span class="dot"></span><h1>Holls Finds — Product Picker</h1><span class="obsessed">obsessed.</span>
</header>
<div class="wrap">

  <div id="ppbanner"></div>

  <div class="pp-step" style="display:flex;align-items:center;justify-content:space-between">Step 1 · Pick a lane<button class="pp-start" id="ppstart">↺ Start over</button></div>
  <div class="lanes" id="lanes">
    <div class="lane active" data-lane="idea">💡 My idea</div>
    <div class="lane" data-lane="catalog">🗂️ My catalog</div>
    <div class="lane" data-lane="seasonal">🗓️ Seasonal</div>
    <div class="lane" data-lane="trending">🔥 Trending</div>
    <div class="lane" data-lane="roundup">🧺 Roundup</div>
  </div>

  <div class="pp-step" id="step2label">Step 2 · Type a product type, then hit Find products</div>
  <div class="searchbar">
    <input id="kw" placeholder="Type a product idea or keyword — e.g. rattan serving tray" />
    <button class="btn" id="go">Find products</button>
  </div>
  <div id="ppsub"></div>
  <div id="pprefine"></div>

  <div class="meters" id="meters"></div>

  <div class="demandcard" id="demandcard"></div>

  <div class="sortbar" id="sortbar" style="display:none">
    Sort by:
    <select id="sort">
      <option value="score">Score (recommended)</option>
      <option value="reviews">Most reviews</option>
      <option value="rating">Highest rating</option>
      <option value="priceUp">Price: low → high</option>
      <option value="priceDown">Price: high → low</option>
    </select>
    <span id="count" style="color:var(--muted)"></span>
  </div>

  <div class="pp-step" id="step3label" style="display:none">Step 3 · Tap to keep your favorites</div>
  <div id="results"></div>
  <div class="gatedout" id="gatedout" style="display:none"></div>
  <div id="more" style="text-align:center;margin:22px 0 6px"></div>
</div>

<div class="tray" id="tray">
  <h3 id="trayhead">✅ Your picks — copy these into the bookmarklet to add them</h3>
  <div class="urls" id="urls"></div>
  <div class="actions">
    <button class="btn" id="copy">Copy all URLs</button>
    <button class="btn ghost" id="clear">Clear picks</button>
    <span id="picknote" style="color:var(--muted);font-size:13px"></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbzYObvkhNOLKGnF6kMmlL3dEjEGziThotCmzz-dzswVMw3aqKRZAnXj6fxy8MX8bj6U/exec";
const TOKEN="holls-pipeline-2026";
const BRIDGE="https://script.google.com/macros/s/AKfycbxPkObU7vxVtY4ZseyenU46h9IQKQStnJMr4XaoQOO3JZLF1-Wtg91yp1Uj5qVNBRhh/exec";
const AIB='<span class="pp-ai">AI</span>';
let LAST=[], PICKS={}, DEMAND=null, PAGE=1, QUERY="", FAILED=0, DEMCOST=null, QUOTA={}, DFSBAL=null, ROUNDUP_THEME=null, ROUNDUP_STYLE='', ROUNDUP_SEASON='', BOARD=null, ROUNDUP_TYPES=[], CAT_LIST=null, CAT_HAVE='', _catLoaded=false;

function api(action,params){
  const q=new URLSearchParams(Object.assign({token:TOKEN,action},params));
  return fetch(API+"?"+q.toString()).then(r=>r.json());
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return (s||"").replace(/&quot;/g,'"').replace(/&#x27;|&#039;/g,"'").replace(/&amp;/g,'&');}
function salesNum(s){const m=(s||"").match(/([\d,.]+)\s*K?\+?\s*bought/i);if(!m)return 0;let n=parseFloat(m[1].replace(/,/g,''));if(/K/i.test(m[0]))n*=1000;return n||0;}

/* ---- LANE: Evergreen room → product types (home + fashion) ---- */
const ROOMS={
 "Entryway":["console table decor","entryway mirror","key holder","table lamp","runner rug","wall hooks"],
 "Living room":["coffee table tray","throw pillow covers","area rug","throw blanket","table lamp","wall art","candle holder"],
 "Bedroom":["duvet cover","nightstand decor","table lamp","throw blanket","wall art","jewelry dish"],
 "Kitchen":["canister set","dish towels","wood cutting board","fruit bowl","counter organizer","coffee station decor"],
 "Bathroom":["bath mat","towel set","vanity tray","soap dispenser","woven storage basket","shower curtain"],
 "Home office":["desk organizer","desk lamp","bookends","wall art","desk mat","file storage box"],
 "Closet / Fashion":["crossbody bag","layered necklace","straw tote bag","maxi dress","ankle boots","silk scarf","sunglasses"]
};
/* ---- LANE: Seasonal pushes (deadline = when to add to On Deck; 0-based month) ---- */
/* ev = event month (0-based), from the board's seasonal calendar. Ramp = the 4 months ev-3..ev.
   A season only shows while it's inside that ramp window, labeled by its calendar phase. */
const SEASONS=[
 {n:"July 4th / Americana",e:"🎆",dl:[5,17],ev:6,seed:"americana decor"},
 {n:"Summer patio",e:"☀️",dl:[5,1],ev:6,seed:"outdoor rug"},
 {n:"Back-to-school / teen room",e:"✏️",dl:[5,17],ev:7,seed:"desk organizer"},
 {n:"Fall / harvest",e:"🍂",dl:[6,18],ev:8,seed:"fall decor"},
 {n:"Halloween",e:"🎃",dl:[7,18],ev:9,seed:"halloween decor"},
 {n:"Thanksgiving / hosting",e:"🦃",dl:[8,17],ev:10,seed:"fall table runner"},
 {n:"Christmas / holiday",e:"🎄",dl:[8,17],ev:11,seed:"christmas decor"},
 {n:"Holiday gift guides",e:"🎁",dl:[9,1],ev:11,seed:"gift ideas under 50"},
 {n:"Winter cozy / hygge",e:"🧣",dl:[10,1],ev:0,seed:"chunky knit throw blanket"}
];
/* calendar phase segments (match the board): prep → light → heavy → final push */
const SEGP=[{lbl:"prep",bg:"#9DB287",fg:"#21301a"},{lbl:"light posting",bg:"#FBE3CE",fg:"#8a5418"},{lbl:"heavy posting",bg:"#F6B89B",fg:"#7a3d14"},{lbl:"final push",bg:"#E2725B",fg:"#ffffff"}];
function seasonPhase(s){ if(s.ev==null) return null; const off=((new Date().getMonth()-(s.ev-3))%12+12)%12; if(off>3) return null; return Object.assign({off},SEGP[off]); }
function activeSeasons(){ return SEASONS.map(s=>{const p=seasonPhase(s);return p?Object.assign({p},s):null;}).filter(Boolean).sort((a,b)=>b.p.off-a.p.off); }
function daysUntil(m,d){const now=new Date(),y=now.getFullYear();let t=new Date(y,m,d);if(t<now)t=new Date(y+1,m,d);return Math.round((t-now)/864e5);}
function apiPost(action,params){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:TOKEN,action},params))}).then(r=>r.json());
}
/* ---- LANE: brain-powered chips (Trending / Coverage-gap) ---- */
async function aiChips(mode,extra){
  const sub=document.getElementById('ppsub');

    const r=(extra&&extra.have)? await apiPost('aiSuggest',Object.assign({mode},extra))

async function roundupTheme(theme){

  try{
    const [rt,rs]=await Promise.all([ api('aiSuggest',{mode:'roundup',context:theme}), api('aiSuggest',{mode:'styles',context:theme}) ]);
    const types=(rt&&rt.suggestions)||[]; let styles=((rs&&rs.suggestions)||[]).slice(0,5);
    if(!types.length){ sub.innerHTML='<div class="pp-subnote">No products — pick another theme.</div>'; return; }
    // research-back the AI styles: rank by LIVE DataForSEO demand
    let ranked=styles.map(s=>({s,v:null}));
    if(styles.length){
      try{
        const isFashion=/wardrobe|closet|outfit|dress|jewel|fashion|necklace|earring|\bbag\b|shoe|boot|scarf|\bstyle\b/i.test(theme);
        const ctx=isFashion?'outfit':'decor';

        const avgs=it&&it.averages;

    h+=`<div class="pp-stylebox"><div class="pp-stylewrap"><input id="ppstyle" class="pp-styleinput" placeholder="type a style, e.g. checkered" value="">`;
    h+=ranked.map(r=>`<button class="pp-chip pp-stylechip" data-style="${String(r.s).replace(/"/g,'&quot;')}">${(r.v!=null&&maxv>0&&r.v===maxv)?'🔥 ':''}${esc(String(r.s))}</button>`).join('');

function roundupQ(t){ return (ROUNDUP_STYLE?ROUNDUP_STYLE+' ':'')+t; }
async function buildBoard(){
  const types=ROUNDUP_TYPES||[]; if(!types.length) return;
  BOARD={cols:types.map(t=>({name:t,q:roundupQ(t),all:[],shown:5,page:1,exhausted:false,picked:null,loading:true}))};
  renderBoard();
  for(const col of BOARD.cols){
    try{
      const prod=await api('searchProducts',{query:col.q});
      QUOTA=(prod&&prod.quota)||QUOTA; try{ if(QUOTA&&QUOTA.remaining!=null) localStorage.setItem('pp_quota',JSON.stringify(QUOTA)); }catch(e){}
      const raw=(prod&&prod.products)||[];
      col.all=raw.filter(p=>p.rating>=4.3&&p.reviews>=100).map(p=>{p._score=scoreProduct(p,12);return p;}).sort((a,b)=>b._score-a._score);
    }catch(e){ col.all=[]; }
    col.loading=false; renderBoard(); renderMeters();
  }
}
/* one card builder for board columns AND the picked tray — same info/look as the main result cards */
function bcard(p,name,opts){
  opts=opts||{};
  const cls=p._score>=70?'promote':(p._score>=55?'watch':'');
  const nm=String(name).replace(/"/g,'&quot;'); const u=String(p.url).replace(/"/g,'&quot;');
  const rm=opts.tray?`<span class="brm" data-unpick="${nm}">×</span>`:'';
  const bp=opts.tray?'':` data-bpick="${nm}|${p.asin}"`;
  const lock=opts.locked?' locked':'';
  return `<div class="pp-pcard${lock}"${bp}>${rm}<div class="bimg"><span class="bscore ${cls}">${p._score}</span>${p.sales?`<span class="bsales">${esc(p.sales)}</span>`:''}<img loading="lazy" src="${p.image}" alt=""></div><div class="pi"><div class="pt">${esc(p.title)}</div><div class="pm"><span class="pp">$${(p.price||0).toFixed(2)}</span><span>★${p.rating} · ${(p.reviews||0).toLocaleString()}</span></div><div class="pact"><a class="peek" href="${p.url}" target="_blank" rel="noopener">peek ↗</a><button class="pcopy" data-copyurl="${u}">📋 Copy</button></div></div></div>`;
}
function renderBoard(){
  if(!BOARD) return;
  const picks=BOARD.cols.filter(c=>c.picked);
  let h=`<div class="pp-strip"><h4>🧺 Your roundup — <span style="font-weight:600;color:var(--muted);font-size:11px">${picks.length} of ${BOARD.cols.length} picked${picks.length?'':' · tap a product in any column to add it'}</span></h4>`;
  if(picks.length) h+=`<div class="pp-traygrid">`+picks.map(c=>bcard(c.picked,c.name,{tray:true})).join('')+`</div>`;
  h+=`</div>`;
  h+=`<div class="pp-board">`;
  h+=BOARD.cols.map(col=>{
    let c=`<div class="pp-col"><div class="pp-colhead">${esc(col.name)}</div>`;
    if(col.loading) c+=`<div class="empty" style="font-size:12px;text-align:center">loading…</div>`;
    else if(!col.all.length) c+=`<div class="empty" style="font-size:12px;text-align:center">no matches</div>`;
    else{
      c+=col.all.slice(0,col.shown).map(p=>bcard(p,col.name,{locked: col.picked&&col.picked.asin===p.asin})).join('');
      if(col.shown<col.all.length || !col.exhausted) c+=`<button class="pp-more" data-more="${String(col.name).replace(/"/g,'&quot;')}">+ more</button>`;
    }
    return c+`</div>`;
  }).join('')+`</div>`;
  document.getElementById('results').innerHTML=h;
  document.getElementById('sortbar').style.display='none';
  document.getElementById('more').innerHTML='';
  const _s3=document.getElementById('step3label'); if(_s3) _s3.style.display='none';
}
function boardPick(v){
  const i=v.indexOf('|'); const name=v.slice(0,i), asin=v.slice(i+1);
  const col=BOARD.cols.find(c=>c.name===name); if(!col) return;
  const p=col.all.find(x=>x.asin===asin); if(!p) return;
  col.picked=(col.picked&&col.picked.asin===asin)?null:p; renderBoard();
}
function boardUnpick(name){ const col=BOARD.cols.find(c=>c.name===name); if(col){ col.picked=null; renderBoard(); } }
async function boardMore(name){
  const col=BOARD.cols.find(c=>c.name===name); if(!col) return;
  if(col.shown+5<=col.all.length){ col.shown+=5; renderBoard(); return; }
  col.page++;
  try{
    const prod=await api('searchProducts',{query:col.q,page:col.page});
    QUOTA=(prod&&prod.quota)||QUOTA;
    const raw=(prod&&prod.products)||[];
    const more=raw.filter(p=>p.rating>=4.3&&p.reviews>=100&&!col.all.find(x=>x.asin===p.asin)).map(p=>{p._score=scoreProduct(p,12);return p;});
    if(!more.length) col.exhausted=true; else col.all=col.all.concat(more).sort((a,b)=>b._score-a._score);
  }catch(e){ col.exhausted=true; }
  col.shown+=5; renderBoard(); renderMeters();
}

/* ---- DEMAND: derive a rising/steady/declining read + 0-20 score from a single-keyword curve ---- */
function analyzeDemand(result){
  try{
    const items=result[0].items[0];
    const data=items.data||[];
    const series=data.map(d=>d.values[0]||0);
    if(!series.length || series.every(v=>v===0)) return {known:false,label:"Low / unmeasured (long-tail)",score:12,color:"var(--muted)",series:[]};
    const n=series.length, recent=series.slice(-8), prior=series.slice(0,-8);
    const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
    const rAvg=avg(recent), pAvg=avg(prior.length?prior:series), peak=Math.max(...series), peakIdx=series.indexOf(peak);
    let label,score,color;
    if(rAvg>pAvg*1.15){label="📈 Rising";score=20;color="var(--good)";}
    else if(rAvg<pAvg*0.85){label="📉 Cooling";score=9;color="var(--warn)";}
    else{label="➡️ Steady";score=15;color="var(--teal)";}
    const peakMonth=data[peakIdx]?new Date(data[peakIdx].date_from).toLocaleString('en',{month:'long'}):null;
    return {known:true,label,score,color,series,peakMonth};
  }catch(e){return {known:false,label:"No data",score:12,color:"var(--muted)",series:[]};}
}

/* ---- SCORE one product (0-100). demand is keyword-level (same for all in a search). ---- */
function scoreProduct(p,demandScore){
  let s=0;
  s+=demandScore;                                   // demand 0-20 (keyword-level)
  // price fit /15
  const pr=p.price||0;
  if(pr>=25&&pr<=80)s+=15; else if(pr>80)s+=13; else if(pr>=20)s+=6; else s+=0;
  // est commission $ (3%) /15
  const com=pr*0.03;
  if(com>=6)s+=15; else if(com>=4)s+=12; else if(com>=2)s+=8; else if(com>=1)s+=4; else s+=1;
  // rating /10
  if(p.rating>=4.6)s+=10; else if(p.rating>=4.4)s+=7; else s+=4;
  // reviews /10
  if(p.reviews>=5000)s+=10; else if(p.reviews>=2000)s+=8; else if(p.reviews>=1000)s+=6; else s+=4;
  // visual/giftability — your eyeball; default neutral-good /20 (you confirm by picking)
  s+=14;
  // competition/popularity from sales velocity /10 (more recent sales = proven mover)
  const sv=salesNum(p.sales);
  if(sv>=500)s+=10; else if(sv>=100)s+=7; else if(sv>0)s+=5; else s+=5;
  if(p.prime)s+=2;                                  // small Prime bonus (not a gate — data unreliable)
  return Math.min(100,Math.round(s));
}

function render(){
  const s3=document.getElementById('step3label'); if(s3) s3.style.display=LAST.length?'block':'none';
  setStep(LAST.length?3:2);
  const sort=document.getElementById('sort').value;
  let list=LAST.slice();
  const cmp={score:(a,b)=>b._score-a._score,reviews:(a,b)=>b.reviews-a.reviews,rating:(a,b)=>b.rating-a.rating,
             priceUp:(a,b)=>(a.price||1e9)-(b.price||1e9),priceDown:(a,b)=>(b.price||0)-(a.price||0)};
  list.sort(cmp[sort]);
  const host=document.getElementById('results');
  if(!list.length){host.innerHTML='<div class="empty">No products cleared the gates for that search. Try a broader or different keyword.</div>';return;}
  host.innerHTML='<div class="grid">'+list.map(p=>{
    const cls=p._score>=70?'promote':(p._score>=55?'watch':'');
    const picked=PICKS[p.asin]?'pick':'';
    const sv=p.sales?`<span class="badge">${esc(p.sales)}</span>`:'';
    return `<div class="card ${picked}" data-asin="${p.asin}">
      <div class="imgwrap"><span class="score ${cls}">${p._score}</span>${sv}
        <img loading="lazy" src="${p.image}" alt=""></div>
      <div class="body">
        <div class="title">${esc(p.title)}</div>
        <div class="meta"><span class="price">$${(p.price||0).toFixed(2)}</span>
          <span class="stars">★${p.rating}</span><span>${p.reviews.toLocaleString()} reviews</span></div>
        <div class="row">
          <button class="pickbtn" data-pick="${p.asin}">${picked?'✓ Picked':'+ Pick'}</button>
          <a class="peek" href="${p.url}" target="_blank">peek ↗</a>
          <button class="pcopy" data-copyurl="${String(p.url).replace(/"/g,'&quot;')}">📋 Copy</button>
        </div>
      </div></div>`;
  }).join('')+'</div>';
}

function refreshTray(){
  const ids=Object.keys(PICKS);
  const tray=document.getElementById('tray');
  const head=document.getElementById('trayhead');
  if(head) head.innerHTML = ROUNDUP_THEME
    ? `🧺 Roundup: <b>${esc(ROUNDUP_THEME)}</b> — ${ids.length} picks`
    : '✅ Your picks — copy these into the bookmarklet to add them';
  if(!ids.length){tray.style.display='none';return;}
  tray.style.display='block';
  document.getElementById('urls').textContent=ids.map(a=>PICKS[a].url).join('\n');
  document.getElementById('picknote').textContent=ids.length+(ROUNDUP_THEME?' in this roundup':' picked');
}

function renderMeters(){
  let s = QUOTA.remaining!=null
    ? `Amazon: <b>${QUOTA.remaining}/${QUOTA.limit}</b> calls left`
    : `Amazon: <b>—</b> (updates after 1st search)`;
  if(DFSBAL!=null) s+=` &nbsp;·&nbsp; DataForSEO: <b>$${Number(DFSBAL).toFixed(2)}</b>`;
  if(DEMCOST!=null) s+=` &nbsp;·&nbsp; last demand: <b>$${DEMCOST}</b>`;
  document.getElementById('meters').innerHTML=s;
}
function maybeWarn(){
  const b=document.getElementById('ppbanner');
  if(DFSBAL!=null && DFSBAL<0.5){
    b.style.display='block';
    b.innerHTML=`⚠️ <b>DataForSEO is running low</b> — only $${Number(DFSBAL).toFixed(2)} left. Top up to keep demand data flowing → <a href="https://app.dataforseo.com/" target="_blank">add funds at app.dataforseo.com</a>`;
  } else { b.style.display='none'; }
}
async function loadBalance(){
  try{ const r=await api('balance'); if(r&&r.ok&&r.balance!=null){ DFSBAL=Number(r.balance); renderMeters(); maybeWarn(); } }catch(e){}
}
function ingest(prod,append){
  const raw=(prod&&prod.products)||[];
  const add=[];
  raw.forEach(p=>{
    if(p.rating>=4.3 && p.reviews>=100){
      if(LAST.find(x=>x.asin===p.asin)||add.find(x=>x.asin===p.asin))return; // dedupe across pages
      p._score=scoreProduct(p,DEMAND.score); add.push(p);
    } else FAILED++;
  });
  LAST = append? LAST.concat(add) : add;
  QUOTA = (prod&&prod.quota)||QUOTA;
  try{ if(QUOTA&&QUOTA.remaining!=null) localStorage.setItem('pp_quota',JSON.stringify(QUOTA)); }catch(e){}
  document.getElementById('sortbar').style.display=LAST.length?'flex':'none';
  document.getElementById('count').textContent=`${LAST.length} passed gates · ${FAILED} filtered out`;
  document.getElementById('gatedout').style.display='block';
  document.getElementById('gatedout').innerHTML=`<b>${FAILED}</b> filtered by your gates (under ★4.3 or under 100 reviews) — kept out automatically.`;
  render(); updateMore(); renderMeters();
}
function updateMore(){
  document.getElementById('more').innerHTML = LAST.length
    ? `<button class="btn ghost" id="moreBtn">＋ Show 20 more options</button><div class="hint" style="margin-top:6px">Pulls the next page · uses 1 Amazon lookup from your monthly quota</div>` : '';
}
async function loadMore(){
  const b=document.getElementById('moreBtn'); if(b){b.disabled=true;b.textContent="Loading…";}
  PAGE++;
  try{ const prod=await api('searchProducts',{query:QUERY,page:PAGE}); ingest(prod,true); }
  catch(e){ toast("Couldn't load more"); const bb=document.getElementById('moreBtn'); if(bb){bb.disabled=false;bb.textContent="＋ Show 20 more options";} }
}

async function showRefine(q){
  const el=document.getElementById('pprefine'); if(!el) return;
  if(!q){ el.innerHTML=''; return; }
  let chips='';
  try{
    const r=await api('aiSuggest',{mode:'styles',context:q});
    let sug=((r&&r.suggestions)||[]).filter(s=>!denied().includes(s));
    chips=sug.map(s=>{const x=String(s).replace(/"/g,'&quot;');return `<button class="pp-chip pp-theme" data-ref="${x}">${esc(String(s))}<span class="pp-deny" data-deny="${x}" title="never suggest again">✕</span></button>`;}).join('');
  }catch(e){}
  el.innerHTML='<div class="pp-subnote" style="margin-top:12px">🔍 Narrow it (optional) '+AIB+' — tap a word, or add your own:</div><div class="pp-chips" style="align-items:center">'+
    chips+'<input id="ppmanref" class="pp-maninput" style="flex:0 1 220px" placeholder="+ your own filter word"><button class="btn" id="ppmanrefadd">Add</button></div>';
}
async function run(){
  const kw=document.getElementById('kw').value.trim();
  if(!kw)return;
  QUERY=kw; PAGE=1; FAILED=0; LAST=[];
  const go=document.getElementById('go');go.disabled=true;go.textContent="Searching…";
  document.getElementById('more').innerHTML='';
  document.getElementById('step3label').style.display='none';
  document.getElementById('pprefine').innerHTML='';
  document.getElementById('results').innerHTML='<div class="empty">Pulling real Amazon products + demand…</div>';
  document.getElementById('demandcard').style.display='none';
  document.getElementById('gatedout').style.display='none';
  try{
    const [prod,dem]=await Promise.all([ api('searchProducts',{query:kw}), api('keywordDemand',{keywords:kw}) ]);
    // demand
    DEMAND = dem && dem.ok ? analyzeDemand(dem.result) : {known:false,label:"No demand data",score:12,color:"var(--muted)",series:[]};
    const dc=document.getElementById('demandcard');dc.style.display='block';
    const spark = DEMAND.series.length? '<div class="spark">'+DEMAND.series.map(v=>`<span style="height:${Math.max(2,v)}%"></span>`).join('')+'</div>':'';
    dc.innerHTML=`<h3>Keyword demand — “${esc(kw)}” &nbsp;<span class="demand-pill" style="background:${DEMAND.color}">${DEMAND.label}</span></h3>
      <div style="font-size:12.5px;color:var(--muted)">${DEMAND.known?('Trend over the past year'+(DEMAND.peakMonth?` · peaks around <b>${DEMAND.peakMonth}</b>`:'')):'Too long-tail for Google trend data — try a broader term, or trust your eye. Using a neutral demand score.'}</div>${spark}`;
    // products → gates → score
    DEMCOST = dem&&dem.api_cost;
    if(DFSBAL!=null && DEMCOST){ DFSBAL=Math.max(0,DFSBAL-DEMCOST); maybeWarn(); }
    ingest(prod,false);
    showRefine(QUERY);
  }catch(e){
    document.getElementById('results').innerHTML='<div class="empty">Something hiccupped: '+esc(String(e.message||e))+'. (If this is a CORS error, open from the board instead.)</div>';
  }
  go.disabled=false;go.textContent="Find products";
}

/* events */
document.getElementById('go').onclick=run;
document.getElementById('kw').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
document.getElementById('sort').onchange=render;
document.getElementById('more').addEventListener('click',e=>{ if(e.target.id==='moreBtn') loadMore(); });
document.getElementById('results').addEventListener('click',e=>{
  if(e.target.closest('.peek')) return;
  const cp=e.target.closest('.pcopy'); if(cp){ navigator.clipboard.writeText(cp.dataset.copyurl); toast('Copied URL'); return; }
  const bp=e.target.closest('[data-bpick]'); if(bp){ boardPick(bp.dataset.bpick); return; }
  const mr=e.target.closest('[data-more]'); if(mr){ boardMore(mr.dataset.more); return; }
  const up=e.target.closest('[data-unpick]'); if(up){ boardUnpick(up.dataset.unpick); return; }
  if(e.target.id==='ppcopyboard'){ const u=BOARD.cols.filter(c=>c.picked).map(c=>c.picked.url).join('\n'); navigator.clipboard.writeText(u); toast('Copied roundup URLs'); return; }
  const b=e.target.closest('[data-pick]'); if(!b)return;
  const asin=b.getAttribute('data-pick'); const p=LAST.find(x=>x.asin===asin);
  if(PICKS[asin])delete PICKS[asin]; else PICKS[asin]=p;
  render(); refreshTray();
});
document.getElementById('lanes').addEventListener('click',e=>{
  const l=e.target.closest('.lane'); if(!l||l.classList.contains('soon'))return;
  document.querySelectorAll('.lane').forEach(x=>x.classList.remove('active')); l.classList.add('active');
  const lane=l.dataset.lane, sub=document.getElementById('ppsub');
  const labels={idea:'Step 2 · Type a product type',catalog:'Step 2 · Pick a category — or see your gaps',seasonal:'Step 2 · Pick a seasonal push',trending:'Step 2 · Pick a trending idea',roundup:'Step 2 · Pick a roundup theme'};
  document.getElementById('step2label').textContent=labels[lane]||'Step 2';
  document.querySelector('.searchbar').style.display='none';
  document.getElementById('step3label').style.display='none';
  document.getElementById('pprefine').innerHTML='';
  if(lane!=='roundup') { ROUNDUP_THEME=null; ROUNDUP_STYLE=''; ROUNDUP_TYPES=[]; refreshTray(); }
  if(lane==='catalog') showCatalog();
  else if(lane==='seasonal') showSeasonal();
  else if(lane==='trending') aiChips('trending');
  else if(lane==='roundup') showThemes();
  else sub.innerHTML=manualOpt('A','Type a product type','Type a product type — e.g. rattan serving tray');
  setStep(2);
});
document.getElementById('ppsub').addEventListener('click',e=>{
  if(e.target.closest('#ppbuildboard')){ buildBoard(); return; }
  if(e.target.closest('#ppmanfind')){ const el=document.getElementById('ppmankw'); if(el&&el.value.trim()){ document.getElementById('kw').value=el.value.trim(); run(); } return; }
  if(e.target.closest('#ppmango')){ const el=document.getElementById('ppmantheme'); if(el&&el.value.trim()) roundupTheme(el.value.trim()); return; }
  const szn=e.target.closest('[data-szn]'); if(szn){ showSeasonal(szn.dataset.szn); return; }
  const season=e.target.closest('[data-season]'); if(season){ showThemes(season.dataset.season||''); return; }
  const refresh=e.target.closest('[data-refresh]'); if(refresh){ if(refresh.dataset.refresh==='themes') showThemes(ROUNDUP_SEASON); else if(ROUNDUP_THEME) roundupTheme(ROUNDUP_THEME); return; }
  const deny=e.target.closest('[data-deny]'); if(deny){ denyItem(deny.dataset.deny); const ch=deny.closest('.pp-chip'); if(ch)ch.remove(); return; }
  const cat=e.target.closest('[data-cat]'); if(cat){ renderCatalog(cat.dataset.cat); return; }
  if(e.target.closest('#ppgaps')){ showGaps(); return; }
  if(e.target.closest('[data-catback]')){ renderCatalog(); return; }
  const room=e.target.closest('[data-room]'); if(room){ showTypes(room.dataset.room); return; }
  if(e.target.closest('[data-back]')){ showRooms(); return; }
  const theme=e.target.closest('[data-theme]'); if(theme){ roundupTheme(theme.dataset.theme); return; }
  const style=e.target.closest('[data-style]');
  if(style){ ROUNDUP_STYLE=style.dataset.style; const inp=document.getElementById('ppstyle'); if(inp)inp.value=ROUNDUP_STYLE;
    document.querySelectorAll('.pp-stylechip').forEach(c=>c.classList.toggle('on',c.dataset.style===ROUNDUP_STYLE)); return; }
  const seed=e.target.closest('[data-seed]');
  if(seed){ if(ROUNDUP_THEME && seed.classList.contains('pp-typechip')) seed.classList.add('done'); else { document.querySelectorAll('#ppsub .pp-chip').forEach(c=>c.classList.remove('sel')); seed.classList.add('sel'); } const q=(ROUNDUP_STYLE?ROUNDUP_STYLE+' ':'')+seed.dataset.seed; document.getElementById('kw').value=q; run(); }
});
document.getElementById('pprefine').addEventListener('click',e=>{
  if(e.target.closest('#ppmanrefadd')){ const el=document.getElementById('ppmanref'); if(el&&el.value.trim()){ document.getElementById('kw').value=(QUERY?QUERY+' ':'')+el.value.trim(); run(); } return; }
  const deny=e.target.closest('[data-deny]'); if(deny){ denyItem(deny.dataset.deny); const ch=deny.closest('.pp-chip'); if(ch)ch.remove(); return; }
  const ref=e.target.closest('[data-ref]'); if(ref){ document.getElementById('kw').value=(QUERY?QUERY+' ':'')+ref.dataset.ref; run(); }
});
document.getElementById('ppsub').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='ppmankw'){ e.preventDefault(); const v=e.target.value.trim(); if(v){ document.getElementById('kw').value=v; run(); } }
  else if(e.target.id==='ppmantheme'){ e.preventDefault(); const v=e.target.value.trim(); if(v) roundupTheme(v); }
});
document.getElementById('pprefine').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ppmanref'){ e.preventDefault(); const v=e.target.value.trim(); if(v){ document.getElementById('kw').value=(QUERY?QUERY+' ':'')+v; run(); } }
});
document.getElementById('ppsub').addEventListener('input',e=>{ if(e.target.id==='ppstyle'){ ROUNDUP_STYLE=e.target.value.trim();
  document.querySelectorAll('.pp-stylechip').forEach(c=>c.classList.toggle('on',c.dataset.style===ROUNDUP_STYLE)); } });
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(Object.keys(PICKS).map(a=>PICKS[a].url).join('\n'));toast('Copied '+Object.keys(PICKS).length+' URLs');};
document.getElementById('clear').onclick=()=>{PICKS={};render();refreshTray();};
function resetAll(){
  PICKS={}; BOARD=null; ROUNDUP_THEME=null; ROUNDUP_STYLE=''; ROUNDUP_SEASON=''; LAST=[]; QUERY='';
  document.getElementById('kw').value='';
  document.getElementById('ppsub').innerHTML='';
  document.getElementById('pprefine').innerHTML='';
  document.getElementById('results').innerHTML='';
  document.getElementById('gatedout').style.display='none';
  document.getElementById('sortbar').style.display='none';
  document.getElementById('more').innerHTML='';
  document.getElementById('demandcard').style.display='none';
  document.getElementById('step3label').style.display='none';
  document.querySelectorAll('.lane').forEach(x=>x.classList.remove('active'));
  const idea=document.querySelector('.lane[data-lane="idea"]'); if(idea)idea.classList.add('active');
  document.getElementById('step2label').textContent='Step 2 · Type a product type';
  document.querySelector('.searchbar').style.display='none';
  document.getElementById('ppsub').innerHTML=manualOpt('A','Type a product type','Type a product type — e.g. rattan serving tray');
  setStep(2);
  refreshTray();
}
document.getElementById('ppstart').onclick=resetAll;
/* on load: default to My idea with inline manual entry; top search box stays hidden (manual is now a lettered option per lane) */
(function(){ const idea=document.querySelector('.lane[data-lane="idea"]'); if(idea){ document.querySelectorAll('.lane').forEach(x=>x.classList.remove('active')); idea.classList.add('active'); } document.getElementById('step2label').textContent='Step 2 · Type a product type'; document.querySelector('.searchbar').style.display='none'; document.getElementById('ppsub').innerHTML=manualOpt('A','Type a product type','Type a product type — e.g. rattan serving tray'); setStep(2); })();
try{ const _q=JSON.parse(localStorage.getItem('pp_quota')); if(_q&&_q.remaining!=null){ QUOTA=_q; renderMeters(); } }catch(e){}  // show last-known Amazon quota immediately
loadBalance();  // show DataForSEO balance + low-balance warning on open
/* when embedded in the board (?embed=1), hide the picker's own header — the board already has a top bar */
if(new URLSearchParams(location.search).has('embed')){ const _h=document.querySelector('header'); if(_h)_h.style.display='none'; }
</script>
</body>
</html>
